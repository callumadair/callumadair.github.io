services:
  dev-frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile

    command: dx serve --package frontend --host 3000 --addr 0.0.0.0
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync+restart
          path: ./frontend
          target: /frontend-workspace/frontend
          ignore:
            - ./frontend/node_modules/
            - ./frontend/target/
            - ./frontend/dist/
        - action: sync+restart
          path: ./shared
          target: /frontend-workspace/shared

  dev-backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: cargo run
    ports:
      - "8080:8080"
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /backend-workspace/backend
          ignore:
            - ./backend/target/
        - action: sync+restart
          path: ./shared
          target: /backend-workspace/shared

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"