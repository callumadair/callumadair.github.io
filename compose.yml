services:
  dev-frontend:
    build:
      context: .
      dockerfile: ./nuxt-frontend/Dockerfile

    command: bun run dev -o
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync+restart
          path: ./nuxt-frontend
          target: /frontend-workspace/nuxt-frontend
          ignore:
            - ./nuxt-frontend/node_modules/
            - ./nuxt-frontend/target/
            - ./nuxt-frontend/dist/

  dev-backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: cargo run
    ports:
      - "8080:8080"
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /backend-workspace/backend
          ignore:
            - ./backend/target/
        - action: sync+restart
          path: ./shared
          target: /backend-workspace/shared

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"