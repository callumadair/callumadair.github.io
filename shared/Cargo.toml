[package]
name = "shared"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/callumadair/callumadair.github.io"
readme = "README.md"
keywords = ["Types"]
description = "Shared types and functions for doing things on both the frontend and backend."
categories = ["web-programming"]

[dependencies]
actix-web.workspace = true
chrono = "0.4.39"
derive_more.workspace = true
dioxus.workspace = true
gloo = "0.11.0"
lucide-dioxus.workspace = true
serde = { version = "1.0.217", features = ["derive"] }
strum.workspace = true
thiserror.workspace = true
web-sys = { version = "0.3.76", features = ["KeyboardEvent", "HtmlDialogElement"] }
regex = "1.11.1"

[lints]
workspace = true
