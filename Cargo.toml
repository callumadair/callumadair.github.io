# This line needs to come before anything else in Cargo.toml
# Unfortunately this is not possible to do here as cranelift does not yet support `wasm-unknown-unknown`.
# cargo-features = ["codegen-backend"]

[workspace]
members = ["backend", "frontend", "shared", "shared/shared_macros", "backend/migration", "backend/entity"]
resolver = "2"

[workspace.dependencies]
dioxus = { version = "0.6.3", features = ["router", "web"] }
gloo = "0.11.0"
lucide-dioxus = "1.1.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.140"
shared = { path = "./shared" }
strum = { version = "0.27.1", features = ["derive"] }
thiserror = { version = "2.0.11" }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
utoipa = { version = "5.3.1", features = ["actix_extras"] }

[workspace.dev-dependencies]
rusty-hook = "0.11.2"

[workspace.lints.rust]
warnings = "warn"
deprecated-safe = "warn"
future-incompatible = "warn"
keyword-idents = "warn"
let-underscore = "warn"
nonstandard-style = "warn"
refining-impl-trait = "warn"
rust-2024-compatibility = "warn"
unused = "warn"

[workspace.lints.clippy]
correctness = "warn"
suspicious = "warn"
complexity = "warn"
perf = "warn"
style = "warn"
cargo = "warn"

unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev]
# Unfortunately this is not possible to do here as cranelift does not yet support `wasm-unknown-unknown`.
#codegen-backend = "cranelift"
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.wasm-dev.package."*"]
opt-level = 3

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
