[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[lib]
path = "./src/lib.rs"
name = "portfolio_backend_lib"

[[bin]]
path = "./src/main.rs"
name = "portfolio_backend_bin"

[dependencies]
actix-settings = "0.8.0"
actix-web = { version = "4.9.0", features = ["rustls"] }
sea-orm = { version = "1.1.4", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
tokio = { version = "1.43.0", features = ["rt", "rt-multi-thread", "macros"] }
tracing = "0.1.41"
tracing-actix-web = "0.7.15"
tracing-subscriber = "0.3.19"

[lints]
workspace = true
