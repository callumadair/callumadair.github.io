[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[lib]
path = "./src/lib.rs"
name = "portfolio_backend_lib"

[[bin]]
path = "./src/main.rs"
name = "portfolio_backend_bin"

[dependencies]
actix-settings = { version = "0.8.0", optional = true }
actix-web = { version = "4.9.0", features = ["rustls"], optional = true }
sea-orm = { version = "1.1.4", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"], optional = true }
strum.workspace = true
thiserror.workspace = true
tokio = { version = "1.43.0", features = ["rt", "rt-multi-thread", "macros"], optional = true }
tracing = "0.1.41"
tracing-actix-web = { version = "0.7.15", optional = true }
tracing-subscriber = "0.3.19"
utoipa = { version = "5.3.1", features = ["actix_extras"], optional = true }
utoipa-actix-web = { version = "0.1.2", optional = true }
utoipa-swagger-ui = { version = "9.0.0", features = ["actix-web", "debug-embed"], optional = true }

[lints]
workspace = true

[features]
default = []
backend = [
    "dep:actix-settings",
    "dep:actix-web",
    "dep:sea-orm",
    "dep:tokio",
    "dep:tracing-actix-web",
    "dep:utoipa",
    "dep:utoipa-actix-web",
    "dep:utoipa-swagger-ui"
]