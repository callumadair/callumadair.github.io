# This line needs to come before anything else in Cargo.toml
cargo-features = [ "codegen-backend" ]

[workspace]
    members  = [ "shared", "migration", "entity" ]
    resolver = "2"

    [workspace.dependencies]
        bon                = "3.7.1"
        derive_more        = { version = "2.0.1", features = [ "display" ] }
        rustls             = { version = "0.23.30", default-features = false }
        serde              = { version = "1.0.217", features = [ "derive" ] }
        serde_json         = "1.0.140"
        shared             = { path = "./shared" }
        strum              = { version = "0.27.1", features = [ "derive" ] }
        thiserror          = { version = "2.0.11" }
        tracing            = "0.1.41"
        tracing-subscriber = "0.3.19"
        utoipa             = { version = "5.3.1", features = [ "actix_extras" ] }


    [workspace.lints.rust]
        warnings                = "warn"
        deprecated-safe         = "warn"
        future-incompatible     = "warn"
        keyword-idents          = "warn"
        let-underscore          = "warn"
        nonstandard-style       = "warn"
        refining-impl-trait     = "warn"
        rust-2024-compatibility = "warn"
        unused                  = "warn"

    [workspace.lints.clippy]
        correctness = { level = "warn", priority = -1 }
        suspicious  = { level = "warn", priority = -1 }
        complexity  = { level = "warn", priority = -1 }
        perf        = { level = "warn", priority = -1 }
        style       = { level = "warn", priority = -1 }
        cargo       = { level = "warn", priority = -1 }

        # Some things that I want to be warned about in code.
        unwrap_used   = "warn"
        expect_used   = "warn"
        todo          = "warn"
        unimplemented = "warn"

        # Cargo lints that flag a lot and either don't really matter or I can't do anything about.
        cargo-common-metadata   = "allow"
        multiple-crate-versions = "allow"

[profile.dev]
    # Unfortunately this is not possible to do here as cranelift does not yet support `wasm-unknown-unknown`.
    codegen-backend = "cranelift"
    opt-level       = 1

    [profile.dev.package."*"]
        opt-level = 3


[profile.server-dev]
    inherits = "dev"

[profile.android-dev]
    inherits = "dev"

[package]
    name         = "backend"
    version      = "0.1.0"
    authors      = [ "Callum Adair" ]
    rust-version = "1.85.0"
    edition      = "2024"
    description  = "The parent crate for all the backend HTTP web server."
    readme       = "README.md"
    repository   = "https://github.com/callumadair/callumadair.github.io/tree/stable/backend"
    license      = "MIT"
    keywords     = [ "server", "http", "backend" ]
    categories   = [ "web-programming::http-server", "database" ]
    # workspace    = ".."

[lib]
    path = "./src/lib.rs"
    name = "portfolio_backend_lib"

[[bin]]
    path = "./src/main.rs"
    name = "portfolio_backend_bin"

[dependencies]
    actix-settings = { version = "0.8.0" }
    actix-web = { version = "4.9.0", features = [ "rustls", "rustls-0_23" ] }
    bon.workspace = true
    color-eyre = "0.6.3"
    entity = { path = "./entity" }
    migration = { path = "./migration", features = [ "sea-orm" ] }
    prometheus = "0.14.0"
    rustls.workspace = true
    sea-orm = { version = "1.1.4", features = [
        "sqlx-postgres",
        "runtime-tokio-rustls",
        "macros",
        "with-chrono",
        "with-json",
    ] }
    serde_json.workspace = true
    shared.workspace = true
    strum.workspace = true
    thiserror.workspace = true
    tokio = { version = "1.43.0", features = [ "rt", "rt-multi-thread", "macros" ] }
    tracing-actix-web = { version = "0.7.15" }
    tracing-subscriber.workspace = true
    tracing.workspace = true
    utoipa.workspace = true
    utoipa-actix-web = { version = "0.1.2" }
    utoipa-swagger-ui = { version = "9.0.0", features = [ "actix-web", "debug-embed" ] }

[lints]
    workspace = true

[features]
    default = [  ]
