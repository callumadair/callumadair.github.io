stages:
  - build
  - check
  - test

.rust:
  cache:
    - key: $CI_COMMIT_REF_SLUG
      paths:
        - backend/.cargo/
        - backend/target
  image: "callumadair/portfolio-backend:latest"
  services:
    - postgres
  variables:
    BACKEND_DIR: "./backend"
    FF_USE_FASTZIP: "true"
    CACHE_COMPRESSION_LEVEL: "fastest"
    POSTGRES_DB: postgres
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: password
    POSTGRES_HOST_AUTH_METHOD: trust
  before_script:
    - cd $BACKEND_DIR

cargo-build:
  extends: .rust
  stage: build
  script:
    - cargo build

clippy:
  extends: .rust
  stage: check
  script:
    - cargo clippy

rustfmt:
  extends: .rust
  stage: check
  script:
    - cargo +nightly fmt --check

llvm-nextest:
  extends: .rust
  stage: test
  # this uses region for coverage summary
  coverage: '/TOTAL\s+(\d+\s+)+(\d+\.\d+\%)/'
  script:
    - cargo llvm-cov nextest
    - cargo llvm-cov report --cobertura --output-path cobertura.xml
  artifacts:
    reports:
      junit: $BACKEND_DIR/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: $BACKEND_DIR/cobertura.xml
