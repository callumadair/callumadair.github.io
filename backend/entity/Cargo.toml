[package]
name = "entity"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "The database entity crate."
readme = "../README.md"
license = "MIT"
keywords = ["database", "entity"]
categories = ["database", "data-structures"]

[dependencies]
sea-orm = { version = "1.1.4", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"], optional = true }
serde.workspace = true

[features]
sea-orm = ["dep:sea-orm"]