[package]
    name         = "entity"
    version      = "0.1.0"
    edition      = "2024"
    rust-version = "1.85.0"
    description  = "The database entity crate."
    readme       = "../README.md"
    license      = "MIT"
    keywords     = [ "database", "entity" ]
    categories   = [ "database", "data-structures" ]

[dependencies]
    actix-web = { version = "4.9.0", features = [ "rustls" ] }
bon = "3.7.1"
    sea-orm = { version = "1.1.4", features = [
        "sqlx-postgres",
        "runtime-tokio-rustls",
        "macros",
        "with-chrono",
        "with-json",
    ] }
    serde.workspace = true
    serde_json.workspace = true
    shared.workspace = true
    thiserror.workspace = true
    utoipa = "5.3.1"

[lints]
    workspace = true

[features]
