[package]
    name    = "migration"
    version = "0.1.0"
    edition = "2024"
    publish = false

[lib]
    name = "migration"
    path = "src/lib.rs"

[dependencies]
    async-std           = { version = "1", features = [ "attributes", "tokio1" ] }
    entity              = { path = "../entity" }
    thiserror.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

    [dependencies.sea-orm-migration]
        version  = "1.1.0"
        features = [ "runtime-tokio-rustls", "sqlx-postgres" ]
        optional = true

[lints]
    workspace = true

[features]
    sea-orm = [ "dep:sea-orm-migration" ]
