[target.x86_64-unknown-linux-gnu]
    linker    = "clang"
    rustflags = [ "-C", "link-arg=-fuse-ld=/usr/bin/mold" ]

[target.x86_64-unknown-linux-musl]
    linker    = "clang"
    rustflags = [ "-C", "link-arg=-fuse-ld=/usr/bin/mold" ]

[unstable]
    codegen-backend = true

[profile.dev]
    codegen-backend = "cranelift"

[build]
    rustflags = [ "-Z", "threads=16" ]
